<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Афиша Москвы — карта мероприятий</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">◎</span>
        <div>
          <h1>Афиша Москвы</h1>
          <p>Карта интересных развлекательных мероприятий</p>
        </div>
      </div>
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Поиск по названию или месту…" autocomplete="off">
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-header">
            <h2>Категории</h2>
            <button id="resetFilters" class="link-btn">Сбросить</button>
          </div>
          <div id="categoryList" class="category-list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Календарь</h2>
            <button id="clearDate" class="link-btn" hidden>Сбросить дату</button>
          </div>
          <div class="calendar">
            <div class="calendar-nav">
              <button id="prevMonth" aria-label="Предыдущий месяц">‹</button>
              <span id="monthLabel"></span>
              <button id="nextMonth" aria-label="Следующий месяц">›</button>
            </div>
            <div class="calendar-weekdays">
              <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>
        </section>

        <section class="panel list-panel">
          <div class="panel-header">
            <h2>Мероприятия</h2>
            <span id="resultCount" class="count-badge">0</span>
          </div>
          <div id="eventList" class="event-list"></div>
        </section>
      </aside>

      <main class="map-area">
        <div id="map"></div>
      </main>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
